[project]
name = "aura-scan-pipeline"
version = "0.1.0"
description = "Self-sovereign iPhone LiDAR to CAD pipeline for digital twin pockets on Minjerribah"
requires-python = ">=3.11"
license = {file = "LICENCE.md"}
authors = [{name = "Luke Nathan Hayes / Aura of Intelligence"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "open3d>=0.19",
    "trimesh>=4.4",
    "networkx>=3.0",
    "shapely>=2.0",
    "ezdxf>=1.3",
    "laspy>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "pillow>=10.0",
]

[project.optional-dependencies]
quality = ["pymeshlab>=2023.12.post2"]
video = ["imageio-ffmpeg>=0.5"]
usd = ["usd-core>=24.0"]
dev = ["pytest>=8.0"]

[project.scripts]
aura-scan = "aura_scan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
